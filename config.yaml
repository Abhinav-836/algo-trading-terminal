# Fast Trading Configuration
mode: "paper"  # paper, paper_alpaca, real

exchange:
  name: "alpaca"
  paper_trading: true
  initial_capital: 100000.0
  symbols: ["AAPL", "MSFT", "GOOGL"]

trading:
  max_position: 10000.0
  max_daily_loss: 5000.0
  default_order_size: 100.0

strategy:
  name: "market_maker"
  params:
    spread: 0.001
    order_size: 100.0

risk:
  enabled: true
  max_leverage: 3.0
  stop_loss: 0.05

performance:
  log_level: "INFO"
  dashboard_port: 8080